<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora Godoy Alexander</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24; /* Fondo oscuro global para resaltar los neones */
        }
        body {
            display: flex;
            flex-direction: column;
            text-align: center;
        }
        header {
            padding: 20px;
            background-color: rgba(54, 14, 110, 0.913);
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            background-color: rgb(45, 50, 50); /* Un gris más oscuro para contrastar */
            box-sizing: border-box;
        }
        main h4 {
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5em;
            margin-bottom: 40px;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #00d2ff,
                0 0 40px #00d2ff,
                0 0 80px #00d2ff;
        }

        /* --- ESTILOS DE LA BITÁCORA --- */
        .grid-bitacora {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px 0;
        }

        .semana-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Animación de entrada */
            opacity: 0;
            transform: translateY(50px);
            animation: fadeIn 0.8s forwards;
        }

        /* Efecto Hover Atractivo */
        .semana-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.1);
            border-color: #00d2ff;
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.4), inset 0 0 15px rgba(0, 210, 255, 0.1);
        }

        .semana-card h3 {
            margin-top: 0;
            color: #00d2ff;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            padding-bottom: 10px;
        }

        /* Contenedores de PDF y Videos */
        .media-container {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 15px;
        }
        
        .media-container video, .media-container iframe {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: none;
        }

        .pdf-btn {
            display: inline-block;
            padding: 10px 25px;
            background: #00d2ff;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            border-radius: 25px;
            transition: background 0.3s;
        }
        
        .pdf-btn:hover {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* Retrasos escalonados para la animación de entrada */
        .semana-card:nth-child(1) { animation-delay: 0.1s; }
        .semana-card:nth-child(2) { animation-delay: 0.2s; }
        .semana-card:nth-child(3) { animation-delay: 0.3s; }
        .semana-card:nth-child(4) { animation-delay: 0.4s; }
        .semana-card:nth-child(5) { animation-delay: 0.5s; }
        .semana-card:nth-child(6) { animation-delay: 0.6s; }
        .semana-card:nth-child(7) { animation-delay: 0.7s; }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- FOOTER --- */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            border-top: 1px solid rgb(193, 208, 100);
            background-color: rgb(38, 71, 71);
            color: white;
        }
        
        /* Estilo para la nueva etiqueta personalizada */
        msgd29 {
            font-weight: bold;
            letter-spacing: 1px;
            color: #c1d064; /* Color que combina con el borde del footer */
        }
    </style>
</head>
<body>

    <main>
